name: 식단 업데이트

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 (한국 시간)
    - cron: "0 1 * * 1"    # 월요일 10:00 한 번 더
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 학교 식단 받아오기
        run: |
          curl -sf --max-time 30 -X POST \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://nuri.karts.ac.kr/nuri/login.do" \
            -d "board_div=skmenu" \
            "https://nuri.karts.ac.kr/nuri/notice2/getWeekMenuView2.do" -o menu.new.json
          grep -q '"cont"' menu.new.json
          mv menu.new.json menu.json
      - name: 바뀐 내용 저장
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json
          git diff --cached --quiet || git commit -m "식단 업데이트"
          git push
